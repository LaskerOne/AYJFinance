<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Tablero de finanzas de pareja: ingresos, gastos, deudas y metas, sincronizado entre los dos." />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%A1%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <title>Cuentas de Dos</title>
    <script>
      // Se aplica el tema guardado antes de pintar, para que no haya un
      // destello del tema contrario mientras carga la aplicación.
      // Sin preferencia guardada, la 2.0 abre en oscuro (dark-first).
      try {
        var t = localStorage.getItem("cuentas-de-dos:tema");
        if (t === "claro") document.documentElement.setAttribute("data-theme", "light");
        else if (t === "sistema") void 0;
        else document.documentElement.setAttribute("data-theme", "dark");
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
      // El color dominante, igual: antes de pintar, para que no destelle.
      try {
        if (localStorage.getItem("cuentas-de-dos:acento") === "violeta")
          document.documentElement.setAttribute("data-acento", "violeta");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
